<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - Shoe Luxe</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Cart Table */
    .cart {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
      background: #fff8f0;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .cart h2 {
      text-align: center;
      color: #d35400;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    table th, table td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }

    table th {
      background: #f39c12;
      color: white;
    }

    table tr:nth-child(even) {
      background: #fff3e0;
    }

    table tr:hover {
      background: #ffe0b2;
    }

    input[type="number"] {
      width: 60px;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background: #e67e22;
      color: white;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #d35400;
    }

    .cart-total {
      text-align: right;
      margin-top: 20px;
      font-size: 1.4em;
      font-weight: bold;
      color: #d35400;
    }

    .cart-actions {
      margin-top: 30px;
      text-align: center;
    }

    .cart-actions a {
      text-decoration: none;
      background: #e67e22;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      margin: 0 10px;
      transition: 0.3s;
    }

    .cart-actions a:hover {
      background: #d35400;
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar sticky">
      <div class="logo">Shoe Luxe</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="cart.html" class="active">Cart</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="signup.html">Sign Up</a></li>
      </ul>
    </nav>
  </header>

  <section class="cart">
    <h2>Your Shopping Cart</h2>
    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Price (৳)</th>
          <th>Quantity</th>
          <th>Subtotal (৳)</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="cart-items">
        <!-- JS will insert rows here -->
      </tbody>
    </table>

    <div class="cart-total">
      Total: ৳<span id="cart-total">0.00</span>
    </div>

    <div class="cart-actions">
      <a href="products.html">Continue Shopping</a>
      <a href="checkout.html">Proceed to Checkout</a>
    </div>
  </section>

  <footer>
    <p>© 2025 Shoe Luxe. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
