<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - Shoe Luxe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar sticky">
      <div class="logo">Shoe Luxe</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html" class="active">Products</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="signup.html">Sign Up</a></li>
      </ul>
    </nav>
  </header>

  <section class="products">
    <div class="product-card" id="product-detail">
      <!-- Dynamic content will be inserted here -->
    </div>
  </section>

  <footer>
    <p>© 2025 Shoe Luxe. All rights reserved.</p>
  </footer>

  <script src="cart.js"></script>
  <script>
    const products = {
      "Casual Sneakers": {
        img: "Shoes photo/casual.jpeg",
        title: "Casual Sneakers",
        desc: "Our Casual Sneakers are lightweight, breathable, and stylish. Perfect for everyday wear and casual outings.",
        price: 4999
      },
      "Running Shoes": {
        img: "Shoes photo/running.jpeg",
        title: "Running Shoes",
        desc: "Durable and comfortable running shoes built for performance. Provides maximum support for long runs.",
        price: 7999
      },
      "Formal Leather Shoes": {
        img: "Shoes photo/formal.jpeg",
        title: "Formal Leather Shoes",
        desc: "Elegant leather shoes perfect for formal occasions, business meetings, and weddings.",
        price: 9999
      },
      "Premium High-Tops": {
        img: "Shoes photo/premium.jpeg",
        title: "Premium High-Tops",
        desc: "Modern and stylish high-top sneakers with premium quality materials for comfort and durability.",
        price: 8999
      }
    };

    // Get product from URL
    const urlParams = new URLSearchParams(window.location.search);
    const productName = urlParams.get("product");

    const productDiv = document.getElementById("product-detail");

    if (products[productName]) {
      const prod = products[productName];
      productDiv.innerHTML = `
        <img src="${prod.img}" alt="${prod.title}">
        <h2>${prod.title}</h2>
        <p>${prod.desc}</p>
        <span>৳${prod.price.toLocaleString()}</span><br><br>
        <button onclick="addToCart('${prod.title}', ${prod.price})">Add to Cart</button>
      `;
      document.title = `${prod.title} - Shoe Luxe`;
    } else {
      productDiv.innerHTML = "<h2>Product not found!</h2>";
    }
  </script>
</body>
</html>
